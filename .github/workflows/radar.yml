name: Flight radar

on:
  schedule:
    - cron: "17 7 * * *"
      timezone: "America/Santiago"
    - cron: "37 13 * * *"
      timezone: "America/Santiago"
    - cron: "43 19 * * *"
      timezone: "America/Santiago"
  workflow_dispatch:
    inputs:
      mode:
        description: Radar command
        required: true
        default: run
        type: choice
        options:
          - run
          - morning
          - midday
          - evening
          - discover
          - verify
          - digest
          - health
          - backfill

permissions:
  contents: read

concurrency:
  group: flight-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SQLITE_PATH: data/radar.sqlite
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      AMADEUS_API_KEY: ${{ secrets.AMADEUS_API_KEY }}
      AMADEUS_API_SECRET: ${{ secrets.AMADEUS_API_SECRET }}
      AMADEUS_BASE_URL: https://api.amadeus.com
      AMADEUS_MONTHLY_CAP: ${{ vars.AMADEUS_MONTHLY_CAP || '0' }}
      AMADEUS_CAP_SAFETY_PERCENT: "80"
      BROWSER_SOURCES_JSON: ${{ secrets.BROWSER_SOURCES_JSON || '[]' }}
      PROMOTION_URLS_JSON: ${{ vars.PROMOTION_URLS_JSON || '[]' }}
      BANK_PRODUCTS: ${{ secrets.BANK_PRODUCTS || '' }}
      LATAM_PASS_TIER: ${{ vars.LATAM_PASS_TIER || 'LATAM' }}
      LATAM_PASS_CLUB: ${{ vars.LATAM_PASS_CLUB || 'false' }}
      HORIZON_DAYS: "60"
      BROWSER_CHECKS_PER_RUN: "8"
      BROWSER_RECHECK_HOURS: "8"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Restore private SQLite history
        uses: actions/cache/restore@v5
        with:
          path: data/radar.sqlite
          key: flight-radar-sqlite-${{ github.run_id }}
          restore-keys: |
            flight-radar-sqlite-

      - run: npm ci
      - if: env.BROWSER_SOURCES_JSON != '[]'
        run: npx playwright install chromium
      - run: npm run build
      - run: npm run db:migrate

      - name: Morning discovery and verification
        if: github.event_name == 'schedule' && github.event.schedule == '17 7 * * *'
        run: npm run radar -- morning

      - name: Midday verification
        if: github.event_name == 'schedule' && github.event.schedule == '37 13 * * *'
        run: npm run radar -- midday

      - name: Evening verification and digest
        if: github.event_name == 'schedule' && github.event.schedule == '43 19 * * *'
        run: npm run radar -- evening

      - name: Manual command
        if: github.event_name == 'workflow_dispatch'
        env:
          RADAR_MANUAL_MODE: ${{ inputs.mode }}
        run: npm run radar -- "$RADAR_MANUAL_MODE"

      - name: Export sanitized dashboard snapshot
        run: npm run dashboard:export -- dashboard-output/data/latest.json

      - name: Persist private SQLite history
        if: success() && env.DATABASE_URL == ''
        uses: actions/cache/save@v5
        with:
          path: data/radar.sqlite
          key: flight-radar-sqlite-${{ github.run_id }}

      - name: Keep nightly private database backup
        if: github.event_name == 'schedule' && github.event.schedule == '43 19 * * *' && env.DATABASE_URL == ''
        uses: actions/upload-artifact@v7
        with:
          name: radar-sqlite-${{ github.run_id }}
          path: data/radar.sqlite
          if-no-files-found: error
          retention-days: 7

      - name: Check out public dashboard repository
        if: vars.DASHBOARD_PUBLISH_ENABLED == 'true'
        uses: actions/checkout@v7
        with:
          repository: sgalvez/flight-fares-dashboard
          ssh-key: ${{ secrets.DASHBOARD_DEPLOY_KEY }}
          path: dashboard-site

      - name: Publish sanitized dashboard data
        if: vars.DASHBOARD_PUBLISH_ENABLED == 'true'
        run: |
          mkdir -p dashboard-site/docs/data
          cp dashboard/.nojekyll dashboard/index.html dashboard/styles.css dashboard/app.js dashboard-site/docs/
          cp dashboard-output/data/latest.json dashboard-site/docs/data/latest.json
          cd dashboard-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Dashboard has no changes"
          else
            git commit -m "Update fares ${{ github.run_id }}"
            git push
          fi

      - name: Upload parser evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: radar-screenshots-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
